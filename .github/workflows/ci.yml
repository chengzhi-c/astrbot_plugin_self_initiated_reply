name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly mutation sweep，UTC 18:00
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install hatch
      - name: Build
        run: hatch build

  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        astrbot: ["4.23.3", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real AstrBot
        run: |
          if [ "${{ matrix.astrbot }}" = "latest" ]; then
            pip install astrbot
          else
            pip install "astrbot==${{ matrix.astrbot }}"
          fi
          pip install -e ".[dev]"
      - name: Host compatibility smoke
        # 锁定版是硬门禁；latest 是上游漂移预警，不阻塞
        run: python scripts/compat_check.py
        continue-on-error: ${{ matrix.astrbot == 'latest' }}

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mutation sweep
        run: python scripts/mutation_check.py
