name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly，UTC 18:00：驱动 compat 作业的 astrbot==latest 上游漂移预警
    # （唯一真正需要时钟的门禁；其余作业由 push/PR 触发已足够）
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # ruff 精确钉版的唯一权威：本地开发用 uvx ruff / gates.py（版本区间见
        # pyproject [dev]），两边不构成“同值声明”，无需跨源互锁。
        run: pip install ruff==0.16.1
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax
        run: |
          shopt -s nullglob
          for f in pages/主动回复设置/*.{js,mjs}; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Frontend contract
        run: node --test tests/frontend_contract.test.mjs

  frontend-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Cache Playwright browsers
        # Chromium 下载约 1-2 分钟且版本只随 package-lock 变：按锁文件哈希缓存。
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser quality gate
        run: npm run test:browser

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      # 纯 Python 无 C 扩展：两端夹住（最低支持版 + 最新版），中间版增量差异面小。
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        # 覆盖率用路径方式（.）追踪——动态加载使模块名 cov 失效（实测）。
        # fail_under 门槛见 pyproject [tool.coverage.report]。
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        # 覆盖率产物只留 3.12 一份：无 job 消费它，三份全传只是占存储。
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  mutation:
    # 变异门禁（scripts/mutation_gate.py）：把「新测试必须实测能捕获目标缺陷」从人工
    # 纪律变成断言。只在 nightly / 手动触发：16 条变异锚定的是“既有测试还能抓既有
    # 缺陷”，只在有人改那些测试或锚点时才可能变红，逐 push 跑是纯浪费。脚本本身
    # 保留（gates.py 本地路径与手动触发都在）。独立作业而不并进 test——注入期间
    # 会临时改写源码，与并行跑的用例共享工作树会互相污染；需要 Node 是因为变异表里
    # 含前端契约条目。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mutation gate
        run: python scripts/mutation_gate.py

  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 两个锁定版都是硬门禁，理由不同：
        # - 4.23.3 是历史基线（本地全局装的也是它）
        # - 4.27.2 是使用者真机在跑的版本，且 0.9.5 那个 P0 只在它上面复现
        #   （宿主 CommandFilter.init_handler_md 从 inspect.signature(handler)
        #   变成 inspect.signature(handler, eval_str=True)）。之前它不在矩阵里
        #   仅仅因为当时没有这个宿主可装，不是因为不需要——现已实测 674 全绿。
        # latest 仍是上游漂移预警（continue-on-error），由 nightly schedule 驱动。
        # 三者的 requires-python 都是 >=3.12，与下方的 3.12 一致。
        astrbot: ["4.23.3", "4.27.2", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real AstrBot
        run: |
          if [ "${{ matrix.astrbot }}" = "latest" ]; then
            pip install astrbot
          else
            pip install "astrbot==${{ matrix.astrbot }}"
          fi
          pip install -e ".[dev]"
      - name: Host compatibility smoke
        # 两个锁定版都是硬门禁；latest 是上游漂移预警，不阻塞。
        # 自 0.9.5 起本脚本除符号存在性外还走一遍宿主的**加载路径**
        # （_handler_signature_gaps，照抄 inspect.signature(handler, eval_str=True)）。
        # 这一步是当初缺的那类检查：符号检查全绿而插件在 4.27.2 上装不上。
        run: python scripts/compat_check.py
        continue-on-error: ${{ matrix.astrbot == 'latest' }}
      - name: Host platform adapter drift guard
        # 平台适配器落盘位置漂移预警：本守卫需要**真实宿主源码**，而 test 作业
        # 不装 astrbot（那里它恒 skip）。只有这里装了锁定版才真正生效：
        # 适配器一旦改用 <data> 之外的系统临时目录，插件 allowlist 会静默拒掉
        # 真实图片（只在真机暴露）。latest 同 compat 语义，只告警不阻塞。
        #
        # 注意本守卫只在 4.23.3 那条腿上真跑：它按 metadata.yaml 的
        # astrbot_version 下限精确锚定版本（理由见 tests/test_vision.py 里
        # _host_platform_sources_dir 的 docstring——扫非锁定版得出的漂移结论无效），
        # 因此 4.27.2 与 latest 两条腿上它 skip 而非失败。这是刻意的，不是漏配。
        run: pytest tests/test_vision.py -k host_platform_adapters -p no:cacheprovider --no-cov -q -rs
        continue-on-error: ${{ matrix.astrbot == 'latest' }}
