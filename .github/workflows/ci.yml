name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly，UTC 18:00：驱动 compat 作业的 astrbot==latest 上游漂移预警
    # （唯一真正需要时钟的门禁；其余作业由 push/PR 触发已足够）
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # 钉版本与 .pre-commit-config.yaml 的 ruff-pre-commit rev、pyproject 的
        # [dev] 三处对齐。该对齐由下面的 Version cross-source gate 断言，不再只靠本注释
        # （0.9.4 阶段 2.4：此前三处一致仅由注释声明，改一处忘另一处无人发现）。
        run: pip install ruff==0.16.1
      - name: Version cross-source gate
        # --cross-only 只比对配置之间，纯 stdlib、不探测本机，故能挂在这个
        # 只装了 ruff 的作业里；完整模式（含本机版本核验）供本地开发手动跑。
        run: python scripts/version_gates.py --cross-only
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Docstring gates
        # 长函数（>50 行）与高复杂度函数（CC>=12）必须有 docstring，且 CC<=21；
        # 阈值单源在 scripts/docstring_gates.py 的 MAX_LINES_WITHOUT_DOC /
        # MIN_CC_REQUIRING_DOC / MAX_CC，tests/ 与 scripts/ 不在扫描范围内。
        # 纯 stdlib，无需装项目依赖，故挂在 lint 作业而非 test 作业。
        run: python scripts/docstring_gates.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax
        run: |
          shopt -s nullglob
          for f in pages/主动回复设置/*.{js,mjs}; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Frontend contract
        run: node --test tests/frontend_contract.test.mjs

  frontend-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser quality gate
        run: npm run test:browser

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --cov-report=xml
      - name: Module coverage gates
        # 生产口径（omit tests/）下关键模块的独立门槛，防止整体门槛掩盖局部盲区
        run: python scripts/coverage_gates.py
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install hatch
      - name: Build
        run: hatch build
      - name: Wheel assertion
        # 内容（开发物不泄漏 + 必需文件齐全）与版本一致性（wheel 文件名与
        # dist-info 必须等于 metadata.yaml 的 version，0.8.3 发布缺陷回归守卫）
        run: python scripts/check_wheel.py

  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 两个锁定版都是硬门禁，理由不同：
        # - 4.23.3 是历史基线（本地全局装的也是它）
        # - 4.27.2 是使用者真机在跑的版本，且 0.9.5 那个 P0 只在它上面复现
        #   （宿主 CommandFilter.init_handler_md 从 inspect.signature(handler)
        #   变成 inspect.signature(handler, eval_str=True)）。之前它不在矩阵里
        #   仅仅因为当时没有这个宿主可装，不是因为不需要——现已实测 674 全绿。
        # latest 仍是上游漂移预警（continue-on-error），由 nightly schedule 驱动。
        # 三者的 requires-python 都是 >=3.12，与下方的 3.12 一致。
        astrbot: ["4.23.3", "4.27.2", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real AstrBot
        run: |
          if [ "${{ matrix.astrbot }}" = "latest" ]; then
            pip install astrbot
          else
            pip install "astrbot==${{ matrix.astrbot }}"
          fi
          pip install -e ".[dev]"
      - name: Host compatibility smoke
        # 两个锁定版都是硬门禁；latest 是上游漂移预警，不阻塞。
        # 自 0.9.5 起本脚本除符号存在性外还走一遍宿主的**加载路径**
        # （_handler_signature_gaps，照抄 inspect.signature(handler, eval_str=True)）。
        # 这一步是当初缺的那类检查：符号检查全绿而插件在 4.27.2 上装不上。
        run: python scripts/compat_check.py
        continue-on-error: ${{ matrix.astrbot == 'latest' }}
      - name: Host platform adapter drift guard
        # 平台适配器落盘位置漂移预警：本守卫需要**真实宿主源码**，而 test 作业
        # 不装 astrbot（那里它恒 skip）。只有这里装了锁定版才真正生效：
        # 适配器一旦改用 <data> 之外的系统临时目录，插件 allowlist 会静默拒掉
        # 真实图片（只在真机暴露）。latest 同 compat 语义，只告警不阻塞。
        #
        # 注意本守卫只在 4.23.3 那条腿上真跑：它按 metadata.yaml 的
        # astrbot_version 下限精确锚定版本（理由见 tests/test_vision.py 里
        # _host_platform_sources_dir 的 docstring——扫非锁定版得出的漂移结论无效），
        # 因此 4.27.2 与 latest 两条腿上它 skip 而非失败。这是刻意的，不是漏配。
        run: pytest tests/test_vision.py -k host_platform_adapters -p no:cacheprovider --no-cov -q -rs
        continue-on-error: ${{ matrix.astrbot == 'latest' }}
