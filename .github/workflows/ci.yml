name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly mutation sweep，UTC 18:00
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # 钉版本与 .pre-commit-config.yaml 的 ruff-pre-commit rev 对齐，避免漂移
        run: pip install ruff==0.16.1
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --cov-report=xml
      - name: Module coverage gates
        # 生产口径（omit tests/）下关键模块的独立门槛，防止整体门槛掩盖局部盲区
        run: python scripts/coverage_gates.py
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install hatch
      - name: Build
        run: hatch build
      - name: Wheel assertion
        # 内容（开发物不泄漏 + 必需文件齐全）与版本一致性（wheel 文件名与
        # dist-info 必须等于 metadata.yaml 的 version，0.8.3 发布缺陷回归守卫）
        run: python scripts/check_wheel.py

  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        astrbot: ["4.23.3", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real AstrBot
        run: |
          if [ "${{ matrix.astrbot }}" = "latest" ]; then
            pip install astrbot
          else
            pip install "astrbot==${{ matrix.astrbot }}"
          fi
          pip install -e ".[dev]"
      - name: Host compatibility smoke
        # 锁定版是硬门禁；latest 是上游漂移预警，不阻塞
        run: python scripts/compat_check.py
        continue-on-error: ${{ matrix.astrbot == 'latest' }}

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mutation sweep
        run: python scripts/mutation_check.py
