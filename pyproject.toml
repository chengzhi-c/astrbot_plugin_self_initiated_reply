[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrbot_plugin_self_initiated_reply"
version = "0.8.3"
requires-python = ">=3.10"
# 运行时零第三方依赖：全部复用宿主 AstrBot API

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "pytest-cov", "ruff", "mypy", "httpx"]

[tool.hatch.build.targets.wheel]
# AstrBot 插件布局：仓库根即包（含 __init__.py），整目录打包验证分发。
packages = ["."]
# Web 页面、资源与元数据不在 wheel 默认的 .py 收集中，需显式纳入。
artifacts = [
  "metadata.yaml",
  "pages/**",
  "assets/**",
  "logo.png",
  "LICENSE",
]

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = []  # 按存量修复后的实际结果收敛

[tool.ruff.lint.per-file-ignores]
# main.py 的 E402 是设计使然：_AGENT_RUNTIME 必须先实例化（capabilities 决定
# MainAgentBuildConfig），后续核心模块导入依赖该别名，无法整体上移。
"main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 覆盖率必须用路径方式（.）追踪——动态加载使模块名 cov 失效（实测）
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
# 生产口径：排除测试自身，恢复指标真实性（历史问题：--cov=. 把 tests/ 也计入分母）
omit = ["tests/*"]

[tool.coverage.report]
# 门槛 70%：生产口径（omit tests/）实测 75.43%（2026-08-04 批次3 补盲后），按"实测-5%"留缓冲。
# 门槛调整以生产口径覆盖率工件实测为准，杜绝拍脑袋定数。
# 历史：0.8.3 及之前 --cov=. 把 tests/ 计入分母，81.62% 为假绿灯，本次已修正口径；
# 65 为 0.8.3 起沿用值（非 -5% 公式产物；公式仅用于门槛调整时）：ffb733a 首次引入
# fail_under=65（当时含 tests 口径实测 77.4%），6c3b97f 修正口径后沿用；
# adapters 37%→97%、recorder_bridge 38%→95% 补盲后实测 75.43%，按 -5% 上调至 70；
# 复审后当前实测 75.79%，缓冲充足。
# 模块级门槛（main.py / image/parser.py）见 scripts/coverage_gates.py，
# 由 CI test 作业在 pytest 之后强制；阈值 = 实测-5% 缓冲，禁止下调。
fail_under = 70

[tool.mypy]
# 仓库目录名含连字符，mypy 无法按包发现；显式列出源码文件 + 忽略宿主
# astrbot/quart 缺失 stub（宿主兼容层，不设 strict 门槛）。
explicit_package_bases = true
ignore_missing_imports = true
files = [
  "main.py",
  "models.py",
  "storage.py",
  "adapters.py",
  "outbound.py",
  "commands.py",
  "utils.py",
  "unified_manager.py",
  "runtime_adapter.py",
  "scheduler.py",
  "webapi.py",
  "session_gate.py",
  "image",
]
