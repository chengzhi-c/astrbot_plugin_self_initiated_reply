[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrbot_plugin_self_initiated_reply"
version = "0.9.2"
requires-python = ">=3.10"
# 运行时零第三方依赖：全部复用宿主 AstrBot API

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "pytest-cov", "ruff", "mypy", "httpx", "tomli; python_version < '3.11'"]

[tool.hatch.build.targets.wheel]
# AstrBot 插件布局：仓库根即包（含 __init__.py），整目录打包验证分发。
packages = ["."]
# Web 页面、资源与元数据不在 wheel 默认的 .py 收集中，需显式纳入。
artifacts = [
  "metadata.yaml",
  "_conf_schema.json",
  "pages/**",
  "assets/**",
  "logo.png",
  "LICENSE",
]
# 开发物不进生产 wheel（实测：整目录打包会把 tests/.scratch/scripts/docs/.github
# 与开发配置全部打进发布包）；exclude 与 artifacts 并存时 artifacts 优先，
# 上方显式声明的 LICENSE/metadata.yaml/logo.png 不受影响。
# 内容断言见 scripts/check_wheel.py（CI build 作业强制）。
exclude = [
  "tests/**",
  "docs/**",
  "scripts/**",
  ".scratch/**",
  ".github/**",
  "*.md",
  ".gitignore",
  ".pre-commit-config.yaml",
]

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = []  # 按存量修复后的实际结果收敛

[tool.ruff.lint.per-file-ignores]
# main.py 的 E402 是设计使然：_AGENT_RUNTIME 必须先实例化探测宿主符号
# （call_event_hook/路径函数），模块级名字供测试替换，无法整体上移。
"main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 覆盖率必须用路径方式（.）追踪——动态加载使模块名 cov 失效（实测）
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
# 生产口径：排除测试自身与 CI 工具脚本，恢复指标真实性
# （历史问题：--cov=. 把 tests/ 计入分母；scripts/ 经 runpy 加载也会进入统计）
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
# 门槛 70%：生产口径（omit tests/）实测 75.43%（2026-08-04 批次3 补盲后），按"实测-5%"留缓冲。
# 门槛调整以生产口径覆盖率工件实测为准，杜绝拍脑袋定数。
# 历史：0.8.3 及之前 --cov=. 把 tests/ 计入分母，81.62% 为假绿灯，本次已修正口径；
# 65 为 0.8.3 起沿用值（非 -5% 公式产物；公式仅用于门槛调整时）：ffb733a 首次引入
# fail_under=65（当时含 tests 口径实测 77.4%），6c3b97f 修正口径后沿用；
# adapters 37%→97%、recorder_bridge 38%→95% 补盲后实测 75.43%，按 -5% 上调至 70；
# 复审后实测 75.79%；0.9.0 D1 三盲区补盲（scheduler 76→98 / delivery 74→94 /
# storage 72→95）后实测 94.47%，按 -5% 上调至 89。
# 模块级门槛（main.py / image/parser.py）见 scripts/coverage_gates.py，
# 由 CI test 作业在 pytest 之后强制；阈值 = 实测-5% 缓冲，禁止下调。
fail_under = 89

[tool.mypy]
# 仓库目录名含连字符，mypy 无法按包发现；显式列出源码文件 + 忽略宿主
# astrbot/quart 缺失 stub（宿主兼容层，不设 strict 门槛）。
# 0.9.0 D2：全源码显式入清单（原 6 模块仅经 main.py 传递检查）。
explicit_package_bases = true
ignore_missing_imports = true
files = [
  "main.py",
  "models.py",
  "storage.py",
  "adapters.py",
  "outbound.py",
  "commands.py",
  "utils.py",
  "runtime_adapter.py",
  "scheduler.py",
  "webapi.py",
  "session_gate.py",
  "decision.py",
  "delivery.py",
  "generation.py",
  "session_coordinator.py",
  "state_saver.py",
  "whitelist.py",
  "image",
]
