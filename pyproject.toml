[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrbot_plugin_self_initiated_reply"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<0.29",
  "httpcore>=1,<1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=5,<8",
  "ruff==0.16.1",
  "mypy>=1.19,<3",
]

[tool.hatch.version]
path = "models.py"
pattern = "PLUGIN_VERSION = ['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["."]
artifacts = [
  "/metadata.yaml",
  "/_conf_schema.json",
  "/pages/**",
  "/logo.png",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
]
exclude = [
  "assets/**",
  "tests/**",
  "docs/**",
  "scripts/**",
  ".scratch/**",
  ".github/**",
  "node_modules/**",
  "output/**",
  "package.json",
  "package-lock.json",
  "playwright.config.mjs",
  "uv.lock",
  "*.md",
  ".gitignore",
  ".editorconfig",
  ".gitattributes",
  "pyproject.toml",
  "PKG-INFO",
  ".coverage",
  ".coverage.*",
  "coverage.*",
  "*.pyc",
  "*.egg-info/**",
  "**/__pycache__/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  ".mypy_cache/**",
  "dist/**",
  "data/**",
]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B", "RUF100"]
lint.ignore = []

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
omit = ["tests/*", "scripts/*"]
branch = true

[tool.coverage.report]
fail_under = 89

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
files = [
  "main.py",
  "models.py",
  "storage.py",
  "adapters.py",
  "outbound.py",
  "commands.py",
  "utils.py",
  "runtime_adapter.py",
  "scheduler.py",
  "webapi.py",
  "session_gate.py",
  "decision.py",
  "delivery.py",
  "generation.py",
  "session_coordinator.py",
  "session_pipeline.py",
  "whitelist.py",
  "plugin_state.py",
  "message_ingress.py",
  "image",
]
