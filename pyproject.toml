[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrbot_plugin_self_initiated_reply"
# 版本号不在此处写死（0.9.4 阶段 2.3）：改由 [tool.hatch.version] 从
# models.PLUGIN_VERSION 读取，见该节的说明。
dynamic = ["version"]
requires-python = ">=3.10"
# 运行时零第三方依赖：全部复用宿主 AstrBot API

[project.optional-dependencies]
# 开发依赖钉版（0.9.4 阶段 2.4）。实测动机：CI 的 mypy / test / compat 三个作业都跑
# `pip install -e ".[dev]"`，而本节此前**一条上界都没有**，等于每次 CI 都装当日最新版。
# 门禁因上游发版而变红时，改动本身是无辜的，排查成本却全落在改动者身上（ruff
# 0.15→0.16 新增 Markdown 围栏检查就这样红过一次，见 scripts/version_gates.py 开头）。
#
# 取值口径：
# - ruff 用**精确**钉版。它同时出现在 ci.yml 的 lint 作业与 .pre-commit-config.yaml
#   的 rev，三处必须同版，否则本地 pre-commit 通过、CI 变红。三处一致性由
#   scripts/version_gates.py --cross-only 断言（此前只有注释声明，无人核验）。
# - 其余工具用**主版本上界**而非精确钉版：test 作业要跨 3.10–3.14 五个 Python，
#   精确钉版会在新 Python 上撞到"该版本没有对应 wheel"。上界只挡破坏性大版本。
# - mypy 下界 1.19：与 .pre-commit-config.yaml 的 mirrors-mypy rev 对齐。实测
#   1.19.0 与 2.3.0 对本仓库均为 Success，故两版共存是无害的，不必强求字面同版。
# - pytest-asyncio 上界 <2：asyncio_mode = "auto" 的语义历史上随大版本变过。
# - pathspec（阶段 2.3 加入）：仅 tests/test_config_schema.py 的打包守卫用它复现
#   hatchling 的 exclude 匹配语义。它本是 hatchling 与 mypy 的传递依赖，装 .[dev]
#   时恰好在，但依赖别人的依赖会在上游删依赖时静默变红，故显式声明。
#   下限对齐 hatchling 的 pathspec>=0.10.1（GitIgnoreSpec 自 0.10.0 起提供）。
# - packaging：scripts/version_gates.py 用它解析本节的版本区间。同上，它本是 pytest
#   的传递依赖，显式声明是同一个理由。
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=5,<8",
  "ruff==0.16.1",
  "mypy>=1.19,<3",
  "httpx>=0.27,<1",
  "pathspec>=0.10.1,<2",
  "packaging>=22",
  "tomli; python_version < '3.11'",
]

[tool.hatch.version]
# 版本号单源（0.9.4 阶段 2.3）：wheel 文件名与 dist-info 从 models.PLUGIN_VERSION
# 派生，不再在此重抄一遍。0.8.7 曾因 pyproject 漏在守卫之外，导致面板显示 0.8.7
# 而 pip 记录 0.8.3——那类"两处字面量不同步"在这里已无法发生（结构上只有一处）。
#
# 仍需手工同步的是 metadata.yaml（宿主安装后读取的静态清单）与 README 徽章，
# 二者由 tests/test_main_runtime.py::test_version_consistency_across_metadata 守。
# 该用例同时核验本节的 path/pattern 真能取到值——否则改坏这里会让构建失败而非静默。
#
# pattern 必须显式写：hatchling 默认只认 __version__ / VERSION 且带行首锚，
# 而本仓库的常量名是 PLUGIN_VERSION（实测默认 pattern 匹配不到）。
path = "models.py"
pattern = "PLUGIN_VERSION = ['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
# AstrBot 插件布局：仓库根即包（含 __init__.py），整目录打包验证分发。
packages = ["."]
# Web 页面、资源与元数据不在 wheel 默认的 .py 收集中，需显式纳入。
#
# **每条都必须带前导 `/` 锚到仓库根**（0.9.5 修复）：这些模式是 gitignore 语义，
# 不带斜杠的 `LICENSE` / `README.md` / `metadata.yaml` 会在**任意深度**命中，而
# artifacts 优先于 exclude，于是被 exclude 排掉的目录里只要存在同名文件就会被
# 重新拉回 wheel。实测触发场景：`.scratch/` 下建了一个 venv 后，site-packages
# 里几百个第三方 LICENSE / README.md / metadata.yaml 全部进包（wheel 213KB →
# 547KB），check_wheel 报出 100+ 条泄漏。加 `/` 后这些深层路径全部不再命中，
# 根目录的六个文件照旧命中（pathspec 实测，两组模式逐条对比）。
artifacts = [
  "/metadata.yaml",
  "/_conf_schema.json",
  "/pages/**",
  "/logo.png",
  "/LICENSE",
  # 面向用户的两份文档必须随包（0.9.5）：下方 exclude 的 `*.md` 原本把它们一起
  # 排掉了，装完插件的目录里没有任何说明文件。artifacts 优先于 exclude，故这里
  # 显式收回这两个，其余 .md（docs/ 下的维护者文档）仍被排除——
  # 那些写的是内部批次标记与开发约定，对使用者无意义。
  # 注意锚点同时修掉了另一个静默缺口：不带 `/` 时 `docs/README.md` 也会命中，
  # 把维护者文档拉进包（实测 True → 加锚后 False）。
  "/README.md",
  "/CHANGELOG.md",
]
# 开发物不进生产 wheel（实测：整目录打包会把 tests/.scratch/scripts/docs/.github
# 与开发配置全部打进发布包）；exclude 与 artifacts 并存时 artifacts 优先，
# 上方显式声明的 LICENSE/metadata.yaml/logo.png 不受影响。
# 内容断言见 scripts/check_wheel.py（CI build 作业强制）。
exclude = [
  # assets/ 是 README 的图源（4 张 JPG / 463KB），代码、pages/、metadata.yaml、
  # _conf_schema.json 引用数为 0，README 全部走 raw.githubusercontent 绝对链接，
  # 运行时永不读取。实测占 0.9.2 wheel 的 69%（687,531 → 213,049 B），故不进分发包，
  # 仍保留在 git 仓库。断言见 scripts/check_wheel.py 的 FORBIDDEN_PREFIXES。
  "assets/**",
  "tests/**",
  "docs/**",
  "scripts/**",
  ".scratch/**",
  ".github/**",
  "*.md",
  ".gitignore",
  ".pre-commit-config.yaml",
  # 测试运行产物。pytest-cov 的并行数据文件名带主机名与 pid
  # （.coverage.<host>.pid<N>.<rand>），不以固定后缀结尾，仅靠上面的
  # 具名条目排不掉；实测它会被整目录打包收进 wheel。
  ".coverage",
  ".coverage.*",
  # 不带点前缀的覆盖率产物（0.9.4 阶段 2.3）：`coverage json` / `--cov-report=xml`
  # 分别写 coverage.json / coverage.xml 到仓库根，上面的 .coverage* 认不出它们。
  # 实测本批次遗留的 coverage.json（220KB）被打进 wheel。用通配而非具名两条，
  # 与 check_wheel.py 的 FORBIDDEN_GLOBS 同宽——两侧的一致性由
  # tests/test_config_schema.py::test_wheel_forbidden_patterns_are_excluded_by_pyproject
  # 逐条核验（该用例用 pathspec 真跑匹配，不比字符串）。
  "coverage.*",
  "*.pyc",
  # setuptools 遗留物（0.9.4 阶段 2.3）：本仓库用 hatchling 不生成 egg-info，
  # 但开发机上一次 `pip install -e .` 留下的 *.egg-info/ 会被整目录打包收进 wheel。
  # check_wheel 早已禁它，这里此前漏排——正是上述反向断言首次抓到的缺口。
  "*.egg-info/**",
  # 任意深度的 __pycache__（0.9.4 阶段 2.3）：原文只写 `__pycache__/**`，它带根锚，
  # 只排仓库根那一个目录，image/__pycache__/ 排不掉。改成 `**/__pycache__/**` 一并
  # 覆盖根层与嵌套层（实测两者都匹配），对应 check_wheel 的
  # `__pycache__/*` 与 `*/__pycache__/*` 两条。
  #
  # 注意本条不是冗余的：上方 `*.pyc` 只管后缀，__pycache__ 目录下的非 .pyc 文件
  # （如 Python 未来版本的新产物）仍要靠本条排掉。守卫用例的探针刻意不带 .pyc
  # 后缀，就是为了让本条真正被测到——带后缀的探针会被 `*.pyc` 顺手匹配，
  # 删掉本条也全绿（该假绿实测发生过一次）。
  "**/__pycache__/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  ".mypy_cache/**",
  "dist/**",
  "data/**",
]

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = []  # 按存量修复后的实际结果收敛

[tool.ruff.lint.per-file-ignores]
# main.py 的 E402 是设计使然：_AGENT_RUNTIME 必须先实例化探测宿主符号
# （call_event_hook/路径函数），模块级名字供测试替换，无法整体上移。
"main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 覆盖率必须用路径方式（.）追踪——动态加载使模块名 cov 失效（实测）
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
# 生产口径：排除测试自身与 CI 工具脚本，恢复指标真实性
# （历史问题：--cov=. 把 tests/ 计入分母；scripts/ 经 runpy 加载也会进入统计）
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
# 门槛 89%：生产口径（omit tests/）实测 94.47% 后按“实测 − 5%”留缓冲定档
# （0.9.0 D1 三盲区补盲：scheduler 76→98 / delivery 74→94 / storage 72→95）。
# 门槛调整一律以生产口径覆盖率工件实测为准，杜绝拍脑袋定数；口径本身为何
# 排除 tests/ 见上方 [tool.coverage.run] 的说明。
# 模块级门槛（main.py / image/parser.py 等）见 scripts/coverage_gates.py，
# 由 CI test 作业在 pytest 之后强制；阈值 = 实测-5% 缓冲，禁止下调。
fail_under = 89

[tool.mypy]
# 仓库目录名含连字符，mypy 无法按包发现；显式列出源码文件 + 忽略宿主
# astrbot/quart 缺失 stub（宿主兼容层，不设 strict 门槛）。
# 0.9.0 D2：全源码显式入清单（原 6 模块仅经 main.py 传递检查）。
explicit_package_bases = true
ignore_missing_imports = true
# 无注解函数的函数体默认被 mypy 跳过。打开后这些函数体也进检查，作用面是
# 「参数与返回全无注解」的函数。实测当前 0 处（webapi.py 的 HTTP 处理器早期
# 是 8 处，已全部补齐注解），故此标志现为前瞻性保留：新增未注解函数时其函数体
# 仍进检查，而不是静默跳过。别因「当前空转」删掉它。
# 注意 ignore_missing_imports 让 astrbot.* 全部解析为 Any，
# 故涉及宿主类型的注解只有文档价值，不产生类型检查力。
check_untyped_defs = true
files = [
  "main.py",
  "models.py",
  "storage.py",
  "adapters.py",
  "outbound.py",
  "commands.py",
  "utils.py",
  "runtime_adapter.py",
  "scheduler.py",
  "webapi.py",
  "session_gate.py",
  "decision.py",
  "delivery.py",
  "generation.py",
  "session_coordinator.py",
  "whitelist.py",
  "image",
]
