repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      # 工具版本跨源一致性：ruff 同时钉在本文件的 rev、ci.yml 的
      # lint 作业与 pyproject 的 [dev]，三处漂移会让本地 pre-commit 与 CI 结论相反。
      # 只在这三个文件之一变更时触发；--cross-only 纯 stdlib，不探测本机版本，
      # 故不会因本地环境装了别的版本而误红。
      - id: version-cross-source
        name: version gates (cross-source pins)
        entry: python scripts/version_gates.py --cross-only
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|\.pre-commit-config\.yaml|\.github/workflows/ci\.yml)$
